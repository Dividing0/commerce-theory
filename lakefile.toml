name = "commerce-theory"
version = "0.1.0"
defaultTargets = ["commerce-theory"]
testDriver = "Tests"

[[require]]
name = "cslib"
scope = "leanprover"
rev = "v4.29.0"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[require]]
name = "timelib"
path = "vendor/timelib"

[[lean_lib]]
name = "CommerceTheory"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[lean_exe]]
name = "commerce-theory"
root = "Main"
